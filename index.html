<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>tb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* This page is an empty shell: it holds no names, no messages and no model. Everything appears only after the
   server accepts the access code. Layout: a code screen; after unlocking, a phone-style group chat with a
   privacy note and settings beside it. */
:root {
  --bg: #f3f6f5; --surface: #fcfdfc; --sunk: #e9efed; --fg: #10201d; --fg-2: #4a5b57; --muted: #74837f; --line: #d9e1df;
  --accent: #d2412b; --water: #1f6f78; --water-wash: #e1f0f1; --ok: #1d7a3f; --ok-wash: #e3f2e8; --warn-wash: #fbf0d9;
  --phone: #ffffff; --bubble: #eef2f1; --lock-bg: #050807; --lock-fg: #e6eeec; --lock-line: #26332f;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1615; --surface: #152120; --sunk: #1a2826; --fg: #e6eeec; --fg-2: #a9b8b4; --muted: #7f8f8b; --line: #26332f;
  --accent: #f0654c; --water: #5fb6bf; --water-wash: #16302f; --ok: #4cc27a; --ok-wash: #173323; --warn-wash: #352a12;
  --phone: #101a19; --bubble: #1f2e2c; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e1615; --surface: #152120; --sunk: #1a2826; --fg: #e6eeec; --fg-2: #a9b8b4; --muted: #7f8f8b; --line: #26332f;
  --accent: #f0654c; --water: #5fb6bf; --water-wash: #16302f; --ok: #4cc27a; --ok-wash: #173323; --warn-wash: #352a12;
  --phone: #101a19; --bubble: #1f2e2c; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.5; }
body.locked { background: var(--lock-bg); }
button, select, input, textarea { font: inherit; color: inherit; }
button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; cursor: pointer; font-weight: 600; font-size: 0.9rem; }
button:disabled { opacity: 0.45; cursor: default; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--water); outline-offset: 2px; }
button.primary { background: var(--accent); color: #fff; border-color: transparent; }
button.quiet { border-color: transparent; background: transparent; color: var(--fg-2); padding: 4px 8px; font-weight: 500; }
select, input[type=text], input[type=password], textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 7px 10px; min-width: 0; }
h1, h2 { font-family: var(--display); margin: 0; text-wrap: balance; }
p { margin: 0; }

/* lock screen */
#lock { min-height: 100%; display: grid; place-items: center; padding-inline: 16px; }
#lock form { display: grid; gap: 10px; width: min(300px, 100%); }
#lock input { background: transparent; border: 1px solid var(--lock-line); color: var(--lock-fg); border-radius: 12px; padding: 12px 14px; text-align: center; letter-spacing: 0.08em; }
#lock button { background: transparent; border-color: var(--lock-line); color: var(--lock-fg); }
#lockMsg { color: #8a9895; font-size: 0.85rem; text-align: center; min-height: 1.3em; }

/* app */
.wrap { max-width: 1080px; margin: 0 auto; padding-inline: 16px; padding-block: 22px 60px; display: grid; gap: 18px; }
.top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.top h1 { font-size: clamp(1.6rem, 4.5vw, 2.3rem); font-weight: 800; letter-spacing: -0.02em; }
.pill { font-family: var(--mono); font-size: 0.74rem; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg-2); background: var(--surface); }
.pill.on { background: var(--ok-wash); color: var(--ok); border-color: transparent; }
.privacy { background: var(--water-wash); border-radius: 14px; padding: 12px 16px; display: grid; gap: 4px; font-size: 0.9rem; }
.privacy b.k { font-family: var(--mono); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--water); }
.privacy ul { margin: 0; padding-left: 18px; display: grid; gap: 2px; }
.main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .main { grid-template-columns: minmax(0, 1fr); } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.panel h2 { font-size: 1.05rem; font-weight: 800; }
.hint { color: var(--fg-2); font-size: 0.85rem; }
.phone { background: var(--phone); border: 1px solid var(--line); border-radius: 26px; overflow: hidden; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; height: min(76vh, 700px); min-height: 460px; }
.phead { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.phead b { font-family: var(--display); font-size: 1rem; }
.phead small { color: var(--muted); font-size: 0.76rem; display: block; }
.phead .tools { margin-left: auto; display: flex; gap: 2px; }
.chat { padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
.empty { color: var(--muted); font-size: 0.9rem; text-align: center; margin: auto; max-width: 34ch; }
.grp { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; align-items: end; }
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 0.8rem; background: var(--c); color: var(--ci); }
.stack { display: grid; gap: 3px; min-width: 0; justify-items: start; }
.who { font-size: 0.74rem; color: var(--fg-2); display: flex; gap: 6px; align-items: center; padding-left: 4px; }
.who i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.badge { font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.06em; text-transform: uppercase; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
.bub { background: var(--bubble); border-radius: 16px; padding: 7px 12px; max-width: min(320px, 100%); overflow-wrap: anywhere; font-size: 0.93rem; }
.grp.bot .bub { box-shadow: inset 0 0 0 1.5px color-mix(in oklab, var(--c) 45%, transparent); }
.rchip { font-size: 0.76rem; border-left: 3px solid var(--muted); padding: 2px 8px; margin-bottom: 4px; color: var(--fg-2); }
.mcard { display: inline-flex; gap: 6px; align-items: flex-start; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 4px 9px; margin: 2px 0; font-size: 0.82rem; }
.mcard .cap { color: var(--fg-2); font-style: italic; }
.mcard .ic { flex: none; }
.pcard { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 10px; align-items: start; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px; margin: 2px 0; max-width: 320px; }
.pcard .tile { width: 54px; height: 54px; border-radius: 9px; display: grid; place-items: center; font-size: 1.4rem; background: repeating-linear-gradient(135deg, var(--sunk) 0 8px, var(--bubble) 8px 16px); }
.pcard .what { font-family: var(--mono); font-size: 0.64rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.pcard .cap { font-size: 0.86rem; color: var(--fg-2); font-style: italic; }
.photobtn { border: 0; padding: 0; background: none; border-radius: 12px; cursor: zoom-in; }
.photobtn:focus-visible { outline: 2px solid var(--water); outline-offset: 2px; }
.reads { margin: 0; background: #14211f; color: #d9e6e3; border-radius: 12px; padding: 12px; font-family: var(--mono); font-size: 0.74rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow: auto; }
.reads .dim { color: #7f9a95; } .reads .go { color: #ffb59f; font-weight: 600; }
.mention { font-weight: 700; color: var(--water); }
.cls { font-size: 0.74rem; color: var(--muted); padding-left: 4px; }
.cls .ok { color: var(--ok); font-weight: 700; }
.typing { display: inline-flex; gap: 4px; padding: 10px 12px; background: var(--bubble); border-radius: 16px; }
.typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25 } 40% { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .typing span { animation: none; opacity: .6; } }
.takecard { display: grid; gap: 3px; justify-items: start; text-align: left; width: 100%; border: 1.5px dashed var(--line); border-radius: 14px; padding: 8px; background: transparent; font-weight: 400; }
.takecard:hover, .takecard:focus-visible { border-color: var(--c); border-style: solid; }
.compose { border-top: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 8px; }
.lab { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); white-space: nowrap; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 0.82rem; font-weight: 500; }
.chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.chip[aria-pressed="true"] { border-color: var(--fg); background: var(--sunk); font-weight: 700; }
.chip.go { border-color: color-mix(in oklab, var(--c) 55%, var(--line)); }
.sendrow { display: flex; gap: 8px; align-items: center; }
.attach { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); cursor: pointer; flex: none; font-size: 1.05rem; }
.attach:focus-within { outline: 2px solid var(--water); outline-offset: 2px; }
.attach input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.preview { display: flex; gap: 8px; align-items: center; font-size: 0.82rem; color: var(--fg-2); }
.preview img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; }
.photo { display: block; max-width: min(240px, 100%); max-height: 260px; border-radius: 12px; margin-bottom: 4px; }
.seen { font-size: 0.72rem; color: var(--muted); font-style: italic; max-width: 320px; }
.sendrow input { flex: 1 1 auto; border-radius: 999px; padding: 9px 14px; }
.side { display: grid; gap: 14px; min-width: 0; }
.settings { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.settings label { display: grid; gap: 4px; font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.settings .full { grid-column: 1 / -1; }
.seg { display: inline-flex; gap: 3px; background: var(--sunk); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 4px 12px; font-size: 0.84rem; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
textarea { width: 100%; resize: vertical; }
.bars { display: grid; gap: 3px; }
.bar { display: grid; grid-template-columns: 62px 1fr 42px; gap: 8px; align-items: center; font-size: 0.8rem; }
.bar .track { height: 9px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.bar .fill { display: block; height: 100%; border-radius: 99px; }
.bar .n { font-family: var(--mono); font-size: 0.74rem; text-align: right; color: var(--fg-2); }
#shotStage { position: fixed; left: -10000px; top: 0; width: 400px; background: var(--phone); color: var(--fg); }
#shotStage .shead { padding: 14px 16px; border-bottom: 1px solid var(--line); }
#shotStage .shead b { font-family: var(--display); font-size: 1.05rem; } #shotStage .shead small { display: block; color: var(--muted); font-size: 0.76rem; }
#shotStage .chat { overflow: visible; height: auto; }
#shotStage .cls { white-space: nowrap; }
#shotStage .sfoot { padding: 8px 16px 12px; font-family: var(--mono); font-size: 0.62rem; color: var(--muted); }
.overlay { position: fixed; inset: 0; z-index: 10; background: rgb(0 0 0 / 0.6); display: grid; place-items: center; padding: 16px; padding-top: calc(16px + env(safe-area-inset-top, 0px)); }
.overlay .card { background: var(--surface); border-radius: 16px; padding: 14px; display: grid; gap: 10px; width: min(440px, 100%); max-height: 100%; overflow: auto; }
.overlay img { width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--line); -webkit-touch-callout: default; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 11; background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: 0.88rem; }
@media (max-width: 640px) {
  .wrap { padding-block: 10px 40px; gap: 12px; }
  .top h1 { font-size: 1.35rem; }
  .main { order: 2; } .privacy { order: 3; } .side { gap: 10px; }
  .phone { height: calc(100dvh - 64px); min-height: 0; border-radius: 18px; }
  .phead { padding: 8px 12px; }
  .chat { padding: 10px 8px; gap: 6px; }
  .grp { grid-template-columns: 26px minmax(0, 1fr); gap: 6px; }
  .av { width: 26px; height: 26px; font-size: 0.72rem; }
  .bub { padding: 6px 10px; font-size: 0.9rem; max-width: 100%; }
  .stack { gap: 2px; }
  .compose { padding: 8px; gap: 6px; }
  .compose .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .compose .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; }
}
[hidden] { display: none !important; }
</style>
</head>
<body class="locked">
<div id="lock">
  <form id="lockForm" autocomplete="off">
    <input type="password" id="code" aria-label="Access code" placeholder="code" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus>
    <button type="submit">Enter</button>
    <p id="lockMsg" aria-live="polite"></p>
  </form>
</div>
<div id="app" hidden></div>

<script>
const API = "https://rossfw--tb-site-web.us-east.modal.run";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const pct = x => Math.round(x * 100) + "%";
const load = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const drop = k => { try { localStorage.removeItem(k); } catch (e) {} };
let TOKEN = load("tb-token", null), FR = [], COLOR = {}, INK = {}, NAMES = [], st = {};

async function api(path, body) {
  const r = await fetch(API + path, {method: "POST", headers: {"Content-Type": "application/json", ...(TOKEN ? {Authorization: "Bearer " + TOKEN} : {})}, body: JSON.stringify(body || {})});
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (r.status === 401 && path !== "/api/login") { lock(); throw new Error("Locked."); }
  if (!r.ok) throw new Error(j.detail || `Error ${r.status}`);
  return j;
}
function lock() { TOKEN = null; drop("tb-token"); drop("tb-friends"); drop("tb-title"); $("app").hidden = true; $("app").innerHTML = ""; $("lock").hidden = false; document.body.className = "locked"; $("code").value = ""; $("code").focus(); }

$("lockForm").addEventListener("submit", async e => {
  e.preventDefault();
  const code = $("code").value.trim(); if (!code) return;
  $("lockMsg").textContent = "Checking…";
  try { const r = await api("/api/login", {code}); TOKEN = r.token; save("tb-token", TOKEN); save("tb-friends", r.friends); save("tb-title", r.title); start(r.friends, r); }
  catch (err) { $("lockMsg").textContent = err.message === "Failed to fetch" ? "Can't reach the server right now." : err.message; }
});

// Returning visitor with a saved session: check it with the server before showing anything.
(async () => {
  if (!TOKEN) return;
  try { const s = await api("/api/status"); start(load("tb-friends", []), s); } catch (e) { lock(); }
})();

function start(friends, status) {
  FR = friends; NAMES = FR.map(f => f.n); FR.forEach(f => { COLOR[f.n] = f.c; INK[f.n] = f.ink; }); st = {...status, title: status.title || load("tb-title", "The chat")};
  document.body.className = ""; $("lock").hidden = true; $("app").hidden = false;
  $("app").innerHTML = `<div class="wrap">
    <div class="top"><h1>${esc(st.title)}, with bots</h1><div class="chips"><span class="pill ${st.open ? "on" : ""}" id="awake">${st.open ? `bots awake until ${esc(st.until)}` : "bots asleep for the day"}</span><button class="quiet" id="lockBtn">Lock</button></div></div>
    <div class="privacy"><b class="k">Private by design</b><ul>
      <li>The bots learned from our group chat, and that chat never leaves our private accounts. This page is an empty shell; it holds none of it.</li>
      <li>The bots run on our own private server, behind this code. What you type goes only to the bots to write a reply; it isn't saved or logged there.</li>
      <li>Photos you add go to the private server only to be described for the bots, then they're thrown away. The photo itself stays in your browser.</li>
      <li>Your conversation stays in this browser only. Clear wipes it; Lock signs this device out.</li></ul></div>
    <div class="main">
      <section class="phone" aria-label="Group chat">
        <div class="phead"><div><b>${esc(st.title)}</b><small id="chatSub"></small></div><div class="tools"><button class="quiet" id="shotBtn" title="Make an image of the whole conversation">Copy image</button><button class="quiet" id="undoBtn">Undo</button><button class="quiet" id="clearBtn">Clear</button></div></div>
        <div class="chat" id="chat" aria-live="polite"></div>
        <div class="compose">
          <div class="chips" id="asChips" role="group" aria-label="Send as"><span class="lab">Send as</span></div>
          <div class="preview" id="preview" hidden></div>
          <div class="sendrow"><label class="attach" title="Add a photo">📷<input type="file" id="photoIn" accept="image/*" aria-label="Add a photo"></label><input type="text" id="msgText" placeholder="Message the group" aria-label="Message" maxlength="500"><button class="primary" id="sendBtn">Send</button></div>
          <div class="chips" id="botChips" role="group" aria-label="Bot reply from"><span class="lab">Bot reply from</span></div>
          <p class="hint" id="genMsg" style="font-size:0.8rem"></p>
        </div>
      </section>
      <div class="side">
        <section class="panel"><h2>How it works</h2>
          <p class="hint">Text the group as anyone, then tap a name under <b>Bot reply from</b>. That friend's bot reads the whole chat and answers in their style. Under each bot reply, a second model guesses who really sounds like that, from texting habits alone.</p></section>
        <section class="panel"><h2>Settings</h2>
          <div class="settings">
            <label>Model<span class="seg" id="modelSeg"><button data-v="instruct" aria-pressed="true">Instruct</button><button data-v="base" aria-pressed="false">Base</button></span></label>
            <label>Year<select id="year"><option value="none">No year</option></select></label>
            <label>Takes per reply<select id="nRep"><option selected>1</option><option>2</option><option>3</option></select></label>
            <label>Training<span class="seg" id="tunedSeg"><button data-v="1" aria-pressed="true">Trained</button><button data-v="0" aria-pressed="false">Untuned</button></span></label>
            <label class="full">Temperature <span id="tempV">0.8</span><input type="range" id="temp" min="0" max="1.3" step="0.1" value="0.8"></label>
          </div>
          <p class="hint"><b>Year</b> sets the chat's date and nudges topics and slang toward that year. <b>Temperature</b>: 0 is the bot's single likeliest reply, higher is more adventurous. <b>Untuned</b> shows the original AI model before it learned the group. <b>Base vs Instruct</b>: two versions of the same model, trained the same way.</p></section>
        <section class="panel"><details id="readsBox"><summary style="cursor:pointer;font-weight:700">What the bots read</summary>
          <p class="hint" style="margin-block:8px">The exact text the next bot gets: the chat's header line, the last 30 messages (photos as their descriptions), then the name of whoever answers. It writes what comes next.</p>
          <pre class="reads" id="reads"></pre></details></section>
        <section class="panel"><h2>Who wrote this?</h2>
          <p class="hint">Type anything and see which friend it sounds like.</p>
          <textarea id="guessText" rows="2" maxlength="500"></textarea>
          <div><button id="guessBtn">Guess</button></div><div id="guessOut"></div></section>
      </div>
    </div></div>`;
  boot();
}

function boot() {
  let chat = load("tb-chat", []), me = load("tb-me", NAMES[0]), model = "instruct", tuned = true, pending = null, choosing = null;
  if (!NAMES.includes(me)) me = NAMES[0];
  const col = n => COLOR[n] || "var(--muted)";
  const mention = new RegExp(`@(${NAMES.join("|")})\\b`, "g");
  const inline = seg => {
    const re = /\[(image|video)(?::\s*([^\]]+))?\]|\[poll:\s*([^\]]+)\]|\[emoji\]|\[link:\s*([^\]]+)\]|(https?:\/\/\S+)/g;
    let out = "", last = 0, m;
    while ((m = re.exec(seg))) {
      out += esc(seg.slice(last, m.index)).replace(mention, '<span class="mention">@$1</span>'); last = re.lastIndex;
      if (m[1] === "image") out += `<span class="pcard" title="Bots can't send real pictures; they describe one, the way photos appeared in the chat they learned from."><span class="tile" aria-hidden="true">📷</span><span><span class="what">photo, described</span><br><span class="cap">${m[2] ? esc(m[2]) : "a photo"}</span></span></span>`;
      else if (m[1]) out += `<span class="mcard"><span class="ic">🎬</span><span>Video${m[2] ? `: <span class="cap">${esc(m[2])}</span>` : ""}</span></span>`;
      else if (m[3]) out += `<span class="mcard">📊 Poll: ${esc(m[3])}</span>`;
      else if (m[0] === "[emoji]") out += `<span class="mcard">Sticker</span>`;
      else if (m[4]) out += `<span class="mcard">🔒 Private link · ${esc(m[4])}</span>`;
      else if (m[5]) out += `<span class="mcard">🔗 ${esc(m[5].replace(/^https?:\/\//, ""))}</span>`;
    }
    return out + esc(seg.slice(last)).replace(mention, '<span class="mention">@$1</span>');
  };
  const REPLY = /^\(replying to (\w+)(?:: "(.*?)")?\) /;
  const IMG = /\[image: ([^\]]*)\]/;
  const msgHTML = t => { let chip = ""; const m = t.match(REPLY); if (m) { chip = `<div class="rchip">↩ <b>${esc(m[1])}</b>${m[2] ? `: “${esc(m[2])}”` : ""}</div>`; t = t.slice(m[0].length); } return chip + inline(t); };
  const cls = (g, who) => { if (!g) return ""; const top = g[0][0], mine = (g.find(x => x[0] === who) || [0, 0])[1];
    return top === who ? `<div class="cls"><span class="ok">✓ sounds like ${esc(who)}</span> ${pct(mine)}</div>` : `<div class="cls">sounds more like <b style="color:${col(top)}">${esc(top)}</b> ${pct(g[0][1])} · ${esc(who)} ${pct(mine)}</div>`; };

  function draw() {
    const msgs = pending ? [...chat, {who: pending, bot: true, typing: true}] : chat;
    let html = "";
    if (!msgs.length && !choosing) html = `<p class="empty">Pick who you're texting as, send a message, then tap a name under "Bot reply from".</p>`;
    else {
      const groups = [];
      msgs.forEach(m => { const g = groups[groups.length - 1]; if (g && g.who === m.who && !!g.bot === !!m.bot && g.turn === m.turn) g.items.push(m); else groups.push({who: m.who, bot: !!m.bot, turn: m.turn, items: [m]}); });
      html = groups.map(g => { const last = g.items[g.items.length - 1];
        const bubbles = g.items.map(m => m.typing ? `<div class="typing" aria-label="${esc(g.who)} is typing"><span></span><span></span><span></span></div>`
          : m.img ? `<button class="photobtn" data-seen aria-label="Show what the bots see"><img class="photo" src="${m.img}" alt="Photo from ${esc(g.who)}"></button>${m.text.replace(IMG, "").trim() ? `<div class="bub">${msgHTML(m.text.replace(IMG, "").trim())}</div>` : ""}<div class="seen" hidden>the bots see: ${esc((m.text.match(IMG) || ["", ""])[1])}</div>`
          : `<div class="bub">${msgHTML(m.text)}</div>`).join("");
        return `<div class="grp${g.bot ? " bot" : ""}" style="--c:${col(g.who)};--ci:${INK[g.who] || "#fff"}"><div class="av">${esc(g.who[0])}</div><div class="stack"><div class="who"><i></i>${esc(g.who)}${g.bot ? `<span class="badge">bot</span>` : ""}</div>${bubbles}${g.bot ? cls(last.guess, g.who) : ""}</div></div>`; }).join("");
      if (choosing) html += `<div class="grp bot" style="--c:${col(choosing.who)};--ci:${INK[choosing.who]}"><div class="av">${esc(choosing.who[0])}</div><div class="stack" style="width:100%"><div class="who"><i></i>${esc(choosing.who)}<span class="badge">bot · pick one</span></div>
        ${choosing.takes.map((t, i) => `<button class="takecard" data-take="${i}">${t.messages.map(m => `<span class="bub">${msgHTML(m)}</span>`).join("")}${cls(t.guess, choosing.who)}</button>`).join("")}<button class="quiet" data-take="none">None of these</button></div></div>`;
    }
    $("chat").innerHTML = html; $("chat").scrollTop = $("chat").scrollHeight;
    drawReads();
    try { localStorage.setItem("tb-chat", JSON.stringify(chat)); } catch (e) { save("tb-chat", chat.map(({img, ...m}) => m)); }
    $("botChips").querySelectorAll(".chip").forEach(c => c.disabled = !!pending || !!choosing); $("sendBtn").disabled = !!choosing;
  }
  function drawReads() {
    if (!$("reads")) return;
    const y = $("year").value, head = y === "none" ? "[The chat]" : `[${esc(st.title)} | ${y}]`;
    const lines = chat.slice(-30).map(m => esc(`${m.who}: ${m.text}`)).join("\n");
    const body = `<span class="dim">${y === "none" ? `[${esc(st.title)}]` : head}</span>\n${lines}${lines ? "\n" : ""}<span class="go">${esc(lastBot || NAMES[0])}:</span>`;
    $("reads").innerHTML = model === "base" ? body : `<span class="dim">&lt;|im_start|&gt;user</span>\n${body.replace(/\n<span class="go">.*$/, "")}<span class="dim">&lt;|im_end|&gt;\n&lt;|im_start|&gt;assistant\n&lt;think&gt;\n\n&lt;/think&gt;</span>\n\n<span class="go">${esc(lastBot || NAMES[0])}:</span>`;
  }
  let lastBot = null;
  const chips = (go, sel) => NAMES.map(n => `<button class="chip${go ? " go" : ""}" data-n="${esc(n)}" ${go ? "" : `aria-pressed="${n === sel}"`} style="--c:${col(n)}"><i></i>${esc(n)}</button>`).join("");
  $("asChips").insertAdjacentHTML("beforeend", chips(false, me));
  $("botChips").insertAdjacentHTML("beforeend", chips(true));
  for (let y = 2026; y >= 2017; y--) $("year").insertAdjacentHTML("beforeend", `<option value="${y}">${y}</option>`);
  $("year").value = load("tb-year", "2026");
  const sub = () => $("chatSub").textContent = `${$("year").value === "none" ? "no year" : $("year").value}${tuned ? "" : " · untuned"}`;
  $("year").onchange = () => { save("tb-year", $("year").value); sub(); drawReads(); };
  const seg = (id, cb) => $(id).addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; e.preventDefault(); [...$(id).children].forEach(x => x.setAttribute("aria-pressed", x === b)); cb(b.dataset.v); sub(); });
  seg("modelSeg", v => { model = v; drawReads(); }); seg("tunedSeg", v => tuned = v === "1");
  $("temp").oninput = () => $("tempV").textContent = $("temp").value;
  sub();
  $("asChips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; me = b.dataset.n; save("tb-me", me); $("asChips").querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b)); $("msgText").focus(); });
  let photo = null;
  $("photoIn").addEventListener("change", e => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {   // shrink to 768 px on the longest side, like the training photos, before it leaves the browser
      const k = Math.min(1, 768 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      photo = c.toDataURL("image/jpeg", 0.85);
      $("preview").hidden = false; $("preview").innerHTML = `<img src="${photo}" alt="Photo to send"><span>Photo ready. Add a message if you like, then Send.</span><button class="quiet" id="unphoto">Remove</button>`;
    };
    img.onerror = () => { $("genMsg").textContent = "Couldn't open that photo."; };
    img.src = url;
  });
  $("preview").addEventListener("click", e => { if (e.target.id === "unphoto") { photo = null; $("preview").hidden = true; } });
  const send = async () => {
    const t = $("msgText").value.trim(); if ((!t && !photo) || choosing || pending) return;
    if (!photo) { chat.push({who: me, text: t}); $("msgText").value = ""; draw(); return; }
    $("sendBtn").disabled = true; $("genMsg").textContent = "Reading the photo…";
    try {
      const r = await api("/api/caption", {image: photo});
      chat.push({who: me, text: (t ? t + " " : "") + r.text, img: photo});
      photo = null; $("preview").hidden = true; $("msgText").value = ""; $("genMsg").textContent = "";
    } catch (err) { $("genMsg").textContent = err.message; }
    $("sendBtn").disabled = false; draw();
  };
  $("sendBtn").onclick = send; $("msgText").addEventListener("keydown", e => { if (e.key === "Enter") send(); });
  $("undoBtn").onclick = () => { if (!chat.length) return; const t = chat[chat.length - 1].turn; chat = t ? chat.filter(m => m.turn !== t) : chat.slice(0, -1); draw(); };
  $("clearBtn").onclick = () => { chat = []; choosing = null; draw(); };
  $("shotBtn").onclick = () => shoot();
  $("lockBtn").onclick = () => { drop("tb-chat"); lock(); };
  $("botChips").addEventListener("click", async e => {
    const b = e.target.closest(".chip"); if (!b || pending || choosing) return;
    const who = b.dataset.n; pending = who; lastBot = who; $("genMsg").textContent = ""; draw();
    try {
      const r = await api("/api/reply", {model, adapter: tuned, responder: who, context: chat.slice(-30).map(({who, text}) => ({who, text})), n: +$("nRep").value, temperature: +$("temp").value, year: $("year").value});
      const all = r.replies.filter(x => x.messages.length), turn = Date.now();
      if (!all.length) $("genMsg").textContent = `${who}'s bot didn't write anything that time. Try again.`;
      else if (all.length === 1) all[0].messages.forEach(t => chat.push({who, text: t, bot: true, turn, guess: all[0].guess}));
      else choosing = {who, takes: all, turn};
    } catch (err) { $("genMsg").textContent = err.message; }
    pending = null; draw();
  });
  $("chat").addEventListener("click", e => {
    const p = e.target.closest("[data-seen]");
    if (p) { const seen = p.parentElement.querySelector(".seen"); if (seen) seen.hidden = !seen.hidden; return; }
    const b = e.target.closest("[data-take]"); if (!b || !choosing) return;
    if (b.dataset.take !== "none") { const t = choosing.takes[+b.dataset.take]; t.messages.forEach(m => chat.push({who: choosing.who, text: m, bot: true, turn: choosing.turn, guess: t.guess})); }
    choosing = null; draw();
  });
  $("guessBtn").onclick = async () => {
    const t = $("guessText").value.trim(); if (!t) return;
    try { const r = await api("/api/guess", {text: t});
      $("guessOut").innerHTML = `<p style="font-size:0.88rem">Sounds most like <b style="color:${col(r.guess[0][0])}">${esc(r.guess[0][0])}</b></p><div class="bars">${r.guess.map(([f, p]) => `<div class="bar"><span style="color:${col(f)};font-weight:600">${esc(f)}</span><span class="track"><span class="fill" style="width:${Math.max(1, p * 100)}%;background:${col(f)}"></span></span><span class="n">${pct(p)}</span></div>`).join("")}</div>`; }
    catch (err) { $("guessOut").textContent = err.message; }
  };
  // ---- conversation -> image ----
  const touch = matchMedia("(pointer: coarse)").matches;
  const lib = () => window.htmlToImage ? Promise.resolve() : new Promise((ok, bad) => { const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"; sc.onload = ok; sc.onerror = bad; document.head.appendChild(sc); });
  const toast = t => { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2200); };
  async function render() {
    if (!chat.length) throw new Error("Nothing to capture yet.");
    await lib();
    const stage = document.createElement("div"); stage.id = "shotStage";
    stage.innerHTML = `<div class="shead"><b>${esc(st.title)}</b><small>${esc($("chatSub").textContent)}</small></div><div class="chat">${$("chat").innerHTML}</div><div class="sfoot">made with the bots</div>`;
    stage.querySelectorAll(".takecard, [data-take], .typing").forEach(n => n.closest(".grp") ? n.closest(".grp").remove() : n.remove());
    stage.querySelectorAll(".seen").forEach(n => n.hidden = false);
    document.body.appendChild(stage);
    try { return await htmlToImage.toBlob(stage, {pixelRatio: 2, backgroundColor: getComputedStyle(stage).backgroundColor, style: {position: "static", left: "0", top: "0"}}); }
    finally { stage.remove(); }
  }
  function showImage(blob) {
    const url = URL.createObjectURL(blob), file = new File([blob], "chat.png", {type: "image/png"});
    const canShare = navigator.canShare && navigator.canShare({files: [file]});
    const ov = document.createElement("div"); ov.className = "overlay";
    ov.innerHTML = `<div class="card" role="dialog" aria-label="Chat image"><img src="${url}" alt="Image of the conversation"><p class="hint">${touch ? "Press and hold the image to copy it or save it to Photos." : "Right-click the image to copy or save it."}</p><div class="chips">${canShare ? `<button class="primary" data-a="share">Share</button>` : ""}${navigator.clipboard && window.ClipboardItem ? `<button data-a="copy">Copy</button>` : ""}<button class="quiet" data-a="close">Close</button></div></div>`;
    ov.addEventListener("click", async e => {
      const a = e.target.dataset.a;
      if (e.target === ov || a === "close") { URL.revokeObjectURL(url); ov.remove(); }
      else if (a === "share") { try { await navigator.share({files: [file]}); } catch (err) {} }
      else if (a === "copy") { try { await navigator.clipboard.write([new ClipboardItem({"image/png": blob})]); toast("Copied. Paste it anywhere."); } catch (err) { toast("Couldn't copy here; press and hold the image instead."); } }
    });
    document.body.appendChild(ov);
  }
  async function shoot() {
    const b = $("shotBtn"); b.disabled = true; b.textContent = "Making image…";
    try {
      if (!touch && navigator.clipboard && window.ClipboardItem) {
        const made = render();   // copy straight away on computers (the clipboard call must start inside the click)
        try { await navigator.clipboard.write([new ClipboardItem({"image/png": made})]); toast("Copied. Paste it anywhere."); }
        catch (err) { showImage(await made); }
      } else showImage(await render());
    } catch (err) { toast(err.message || "Couldn't make the image."); }
    b.disabled = false; b.textContent = "Copy image";
  }

  draw();
  setInterval(async () => { try { const s = await api("/api/status"); $("awake").className = "pill" + (s.open ? " on" : ""); $("awake").textContent = s.open ? `bots awake until ${s.until}` : "bots asleep for the day"; } catch (e) {} }, 60000);
}
</script>
</body>
</html>
